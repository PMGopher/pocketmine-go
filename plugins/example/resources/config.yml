# ExamplePlugin configuration. This file is copied to plugin_data/ExamplePlugin/config.yml the
# first time the plugin is enabled; edit that copy, then run "/example reload".

# Title shown to a player when they join. {player} is replaced by their name.
welcome-title: "§aWelcome, {player}!"
welcome-subtitle: "§7Running on pocketmine-go"

# How often (in minutes) the server broadcasts the tip below. 0 turns it off.
tip-interval: 5
tip: "§eTip: type /example to say hello!"
